name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Validate version tag
        run: bun -e 'const p = await Bun.file("package.json").json(); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("Version tag must match package.json")'
      - run: npm pkg fix && git diff --exit-code package.json
      - run: bun run typecheck
      - run: bun run test
      - name: Inspect package
        run: bun run check:package
      - run: npm publish --provenance --access public
